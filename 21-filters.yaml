- name: ansible filters
  hosts: web 
  tasks:
  - name: undefined varaible
    ansible.builtin.debug:
      msg: "Hello {{ Person | default('Ramu') }}"

  - name: string to list conversion
    vars:
      fruits: "apple, banana, Mango"
    ansible.builtin.debug:
      msg: "{{ fruits | split(',') }}"

  - name: dict to list conversion
    vars: 
      dict:
        name: Devops
        time: 10
        age: 26
    ansible.builtin.debug:
      msg: "{{ dict | dict2items }}"