- name: print number greater than 15 
  hosts: web 
  tasks:
  - name: print if number greater than 15 
    vars:
      my_number: 20 
    ansible.builtin.debug:
      msg: "Given number {{ my_number }} is greater than 15"
    when: my_number > 15

    ansible.builtin.debug:
      msg: "Given number {{ my_number }} is less than or equal to 15"
    when: my_number <= 15